name: veille

on:
  schedule:
    - cron: "4-59/10 * * * *"  # toutes les 10 min, à :04 :14 :24… (GitHub déconseille les minutes rondes, surchargées)
  workflow_dispatch:          # bouton « Run workflow » pour lancer à la main

permissions:
  contents: write

concurrency:
  group: veille
  cancel-in-progress: false

jobs:
  veille:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main  # la dernière version, pas celle du moment du lancement (sinon un lancement en file d'attente repart de données périmées)

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - run: pip install -r scraper/requirements.txt

      - name: Récupérer les annonces et alerter
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scraper/collect.py

      - name: Enregistrer les changements
        run: |
          git add docs/data
          if git diff --cached --quiet; then echo "Rien de nouveau."; exit 0; fi
          git config user.name "veille-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Annonces mises à jour"
          # En cas de conflit sur les données, notre relevé (le plus récent) l'emporte.
          git pull --rebase -X theirs
          git push
